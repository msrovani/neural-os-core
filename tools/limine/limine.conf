# ADR-0065 — limine.conf (Limine moderno ≥8)
# timeout>0: menu visivel = firmware+BOOTX64 OK; 0 esconde e parece freeze
# enquanto carrega kernel.elf (~20MB) no USB 2.0.
timeout: 3
serial: yes
verbose: yes

/Neural-OS
    protocol: limine
    path: boot():/kernel.elf
    kernel_path: boot():/kernel.elf
