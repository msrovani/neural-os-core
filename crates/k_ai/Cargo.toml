[package]
name = "k_ai"
version = "1.9.9"
edition = "2021"

[dependencies]
spin = "0.12"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
x86_64 = "0.14.11"
libm = "0.2"
event-bus = { path = "../event-bus" }
ticket-lock = { path = "../ticket-lock" }
agent-core = { path = "../agent-core" }
cortex = { path = "../cortex" }
k-nano = { path = "../k_nano" }
k-hal = { path = "../k_hal" }
# neural-sgdb: path = junction local → C:\DEV\neural-sgdb (repo comunitário).
# Sempre acompanhar a tip de lá (hoje v1.1.20). default-features=false =
# no_std puro (SSE2 gateado off em x86_64-unknown-none desde upstream 3cc3010).
neural-sgdb = { path = "../neural-sgdb", default-features = false }

[features]
kernel = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("kernel"))'] }
