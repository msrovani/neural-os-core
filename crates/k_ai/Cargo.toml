[package]
name = "k_ai"
version = "1.9.9"
edition = "2021"

[dependencies]
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
x86_64 = "0.14.11"
libm = "0.2"
event-bus = { path = "../event-bus" }
skill-registry = { path = "../skill-registry" }
ticket-lock = { path = "../ticket-lock" }
agent-core = { path = "../agent-core" }
cortex = { path = "../cortex" }
k-nano = { path = "../k_nano" }
k-hal = { path = "../k_hal" }

# P0: neural-sgdb removido — SSE2 intrinsics crasham rustc com soft-float.
# Gateado atras de feature "nsgdb" — reativar quando neural-sgdb suportar no_std sem SIMD.

[features]
kernel = []
nsgdb = []  # P0: ativar para reativar tickv_adapter + nsgdb_bridge (requer neural-sgdb)

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("kernel"))'] }
