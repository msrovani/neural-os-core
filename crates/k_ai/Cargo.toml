[package]
name = "k_ai"
version = "1.9.9"
edition = "2021"

[dependencies]
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
x86_64 = "0.14.11"
libm = "0.2"
event-bus = { path = "../event-bus" }
skill-registry = { path = "../skill-registry" }
ticket-lock = { path = "../ticket-lock" }
agent-core = { path = "../agent-core" }
cortex = { path = "../cortex" }
k-nano = { path = "../k_nano" }
k-hal = { path = "../k_hal" }
# neural-sgdb v1.1.13: no_std puro sem default features (SSE2 gateado off
# x86_64-unknown-none no upstream 3cc3010) — host E bare-metal.
neural-sgdb = { path = "../neural-sgdb", default-features = false }

[features]
kernel = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("kernel"))'] }
