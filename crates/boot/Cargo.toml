[package]
name = "boot"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
bootloader = "0.11"
# fat-boot-log ON: grava BOOT.LOG (8.3 pré-alocado) no FAT32 do pendrive — notebooks sem COM.
# Sobrescrita via USB-MSC/ATA (sem alocar clusters novos). Em QEMU/WHPX o flush é rate-limited.
neural-kernel = { path = "../neural-kernel", artifact = "bin", target = "x86_64-unknown-none", features = ["fat-boot-log"] }
