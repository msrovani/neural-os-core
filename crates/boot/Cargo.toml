[package]
name = "boot"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
bootloader = "0.11"
# fat-boot-log OFF: write B*.LOG no boot varre FAT inteira (PIO) e trava WHPX minutos.
# Ative só para captura em disco sem serial: features = ["fat-boot-log"]
neural-kernel = { path = "../neural-kernel", artifact = "bin", target = "x86_64-unknown-none" }
