[package]
name = "hermes"
version = "1.9.9"
edition = "2021"

[dependencies]
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
x86_64 = "0.14.11"
libm = "0.2"
event-bus = { path = "../event-bus" }
skill-registry = { path = "../skill-registry" }
ticket-lock = { path = "../ticket-lock" }
agent-core = { path = "../agent-core" }
k-nano = { path = "../k_nano" }
k-hal = { path = "../k_hal" }
cortex = { path = "../cortex" }
k_ai = { path = "../k_ai" }
smoltcp = { version = "0.13", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4", "proto-dhcpv4"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
wasmi = { version = "0.47", default-features = false }
cranelift-codegen = { version = "0.133", default-features = false, features = ["core"], optional = true }
# C5 TLS (soft-float): embedded-tls 0.19 + p256/rsa — canônico hermes (lesson 241/249)
embedded-tls = { version = "0.19", default-features = false }
embedded-io = { version = "0.7", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
digest = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
rand_core = { version = "0.6", default-features = false }

[features]
kernel = []
jit-cranelift = ["dep:cranelift-codegen"]
