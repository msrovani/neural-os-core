[package]
name = "k-hal"
version = "0.1.0"
edition = "2021"
description = "ADR-0041 R1 — device HAL / VirtIO-bound backends (L1 sensório-motor)"

[dependencies]
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
x86_64 = "0.14.11"
libm = "0.2"
event-bus = { path = "../event-bus" }
ticket-lock = { path = "../ticket-lock" }
k-nano = { path = "../k_nano" }
cortex = { path = "../cortex" }
agent-core = { path = "../agent-core" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("kernel"))'] }
