[package]
name = "k-nano"
version = "1.5.0"
edition = "2021"

[dependencies]
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
uart_16550 = "0.2"
x86_64 = "0.14.11"
linked_list_allocator = "0.9"
talc = "4.4.3"
spinning_top = "0.3"
libm = "0.2"
event-bus = { path = "../event-bus" }
skill-registry = { path = "../skill-registry" }
ticket-lock = { path = "../ticket-lock" }
agent-core = { path = "../agent-core" }
ed25519-compact = { version = "2", default-features = false, features = ["x25519"] }
# ADR-0081 Tier F: AEAD X25519+ChaCha20-Poly1305 (sem getrandom — bare-metal).
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
smoltcp = { version = "0.13", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4", "proto-dhcpv4"] }
ruvix-proof = { version = "0.1", default-features = false, features = ["alloc"] }
ruvix-vecgraph = { version = "0.1", default-features = false, features = ["alloc"] }
ruvix-types = { version = "0.1", default-features = false, features = ["alloc"] }
ruvix-region = { version = "0.1", default-features = false, features = ["alloc"] }

[features]
default = []
# Apenas bins standalone que não definem seu próprio #[global_allocator].
global-alloc = []
# Soft-reboot 0xCF9 para flush BOOT.LOG — **OFF em produto** (loop HW sem NEURDONE).
soft-reboot-bootlog = []
# Labor 39: PC speaker boot chime — OFF default.
boot-chime = []
# Labor 53: AP workers vivos (`ap_pollable`) — OFF default (deadlock sem IDT/IPI pleno).
ap-pollable = []
# Persiste BOOT.LOG no FAT32 (pendrive live USB / HW sem COM). O bin propaga
# via `fat-boot-log = ["k-nano/fat-boot-log"]` — sem isto, persist_now era
# stub permanente (feature inexistente na crate) e o stick nunca recebia log.
fat-boot-log = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("kernel", "soft-reboot-bootlog", "fat-boot-log"))'] }
