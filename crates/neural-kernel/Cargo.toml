[package]
name = "neural-kernel"
version = "1.9.9"
edition = "2021"

[dependencies]
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
uart_16550 = "0.2"
x86_64 = "0.14.11"
talc = "4.4.3"
linked_list_allocator = "0.9"
spinning_top = "0.3"
libm = "0.2"
event-bus = { path = "../event-bus" }
skill-registry = { path = "../skill-registry" }
ticket-lock = { path = "../ticket-lock" }
smoltcp = { version = "0.13", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4", "proto-dhcpv4"] }
agent-core = { path = "../agent-core" }
ed25519-compact = { version = "2", default-features = false }
# ADR-0016 N4 — TLS 1.3. Soft-float: force soft crypto (CLMUL/SHA-NI break LLVM).
embedded-tls = { version = "0.19", default-features = false }
rand_core = { version = "0.6", default-features = false }
embedded-io = { version = "0.7", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
digest = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# Labor 23: RSA-PSS SHA256 CertificateVerify (hosts RSA).
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
# ADR-0042 N2.5: k_nano com global-alloc (bin delega allocator para k_nano via drift cleanup).
k-nano = { path = "../k_nano", features = ["global-alloc"] }
k-hal = { path = "../k_hal" }
k_ai = { path = "../k_ai" }
# ADR-0042 N3.5: dep direta cortex (tensor/trinity/arena…); bin mantém mod cortex integração.
# ADR-0081 item 4: feature p2p ativa o matmul distribuído Worker→Master.
cortex-crate = { path = "../cortex", package = "cortex", features = ["p2p"] }
# ADR-0042 N4.6: dep direta hermes (cron/safety/wasm/skills…); bin mantém agents + net stack.
hermes-crate = { path = "../hermes", package = "hermes" }
# ADR-0042 N5.7: dep direta jarbas (display/gpu/persona…); bin mantém audio (ADR-0045) + jarbas_fb.
jarbas-crate = { path = "../jarbas", package = "jarbas" }

[features]
default = ["ring3"]
ring3 = []
heap-trace = ["k-nano/heap-trace"]
# Sprint 107 QEMU HIT clima (STT-sim seed + lexicon constrained). Off = HW real.
weather-e2e = []
# Persiste B*.LOG no FAT32 (útil em pendrive sem cabo serial). Off por default
# (PIO ATA no boot pode ser lento); ative para captura em disco:
#   cargo nk --features fat-boot-log
fat-boot-log = []
# Soft-reboot 0xCF9 para BOOT.LOG — **default OFF**. Nunca ligar em HW produto
# (loop: NEURLOG! sem UEFI writer de NEURDONE). Debug/experimento apenas.
fat-boot-log-soft-reboot = ["fat-boot-log", "k-nano/soft-reboot-bootlog"]
# ttf-parser não é compatível com no_std puro.
# Usamos ferramenta Python tools/convert_ttf_to_bitmap.py para converter TTF
# em arrays Rust embutidos, sem runtime parsing.

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("kernel", "fat-boot-log", "fat-boot-log-soft-reboot", "weather-e2e"))'] }

[package.metadata.bootimage]
run-args = ["-m", "2G", "-serial", "stdio", "-nic", "user,model=rtl8139", "-smp", "2", "-accel", "whpx"]
