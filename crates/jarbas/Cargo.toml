[package]
name = "jarbas"
version = "1.9.9"
edition = "2021"

[dependencies]
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
x86_64 = "0.14.11"
libm = "0.2"
heapless = "0.8"
# ADR-0058: fundação 2D no_std (MIT/Apache) — DrawTarget sobre DoubleBuffer.
embedded-graphics = "0.8"
event-bus = { path = "../event-bus" }
ticket-lock = { path = "../ticket-lock" }
agent-core = { path = "../agent-core" }
skill-registry = { path = "../skill-registry" }
k-nano = { path = "../k_nano" }
k-hal = { path = "../k_hal" }
cortex = { path = "../cortex" }
hermes = { path = "../hermes" }

[features]
default = []
# ADR-0089: HUD de cpu_stats na gauge bar.
smp-runqueue = ["k-nano/smp-runqueue"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("kernel", "smp-runqueue"))'] }
