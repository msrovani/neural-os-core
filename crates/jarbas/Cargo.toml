[package]
name = "jarbas"
version = "1.9.9"
edition = "2021"

[dependencies]
spin = "0.9"
libm = "0.2"
# ADR-0058: fundação 2D no_std — DrawTarget sobre DoubleBuffer (0.8.2 max_stable).
embedded-graphics = "0.8.2"
event-bus = { path = "../event-bus" }
ticket-lock = { path = "../ticket-lock" }
agent-core = { path = "../agent-core" }
skill-registry = { path = "../skill-registry" }
k-nano = { path = "../k_nano" }
k-hal = { path = "../k_hal" }
cortex = { path = "../cortex" }
hermes = { path = "../hermes" }
# Removidos SESSION_381: heapless / lazy_static / x86_64 — zero callers no crate.
# spin 0.12 / x86_64 0.15 = IDEA #597/#602 (workspace, não só jarbas).

[features]
default = []
smp-runqueue = ["k-nano/smp-runqueue"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("kernel", "smp-runqueue"))'] }
