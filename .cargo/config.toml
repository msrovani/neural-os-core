[unstable]
bindeps = true

# --- Paralelismo multicore (Cargo + rustc) ---
# Cargo compila crates em paralelo por default (= # CPUs lógicos).
# `jobs` explícito evita herança de CARGO_BUILD_JOBS=1 / -j1 em shells/CI.
# rustc dentro de cada crate: ver codegen-units em Cargo.toml [profile.release].
# Nightly: -Z threads=N paralelo no front-end MIR (além do LLVM codegen-units).
[build]
jobs = 16
rustflags = ["-Z", "threads=16"]

# N1.0: nightly 1.98 ativa sse* em x86_64-unknown-none por default →
# LLVM `error: offset is not a multiple of 16`. Kernel = soft-float.
# Sempre passar `--target x86_64-unknown-none` (ou use alias `nk`).
[target.x86_64-unknown-none]
rustflags = [
    "-C", "target-feature=-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2",
    "--cfg", "polyval_force_soft",
    "--cfg", "aes_force_soft",
    "-Z", "threads=16",
]

[alias]
nk = "build --release -p neural-kernel --target x86_64-unknown-none"
# Override pontual: cargo nk -j 24   ou  $env:CARGO_BUILD_JOBS=24
