[unstable]
bindeps = true

# --- Paralelismo multicore (Cargo) ---
# -Z threads=16 removed: causes STATUS_ILLEGAL_INSTRUCTION (0xc000001d)
# in LLVM codegen of k_ai on nightly-2026-07-05 soft-float x86_64-unknown-none.
[build]
jobs = 16

[target.x86_64-unknown-none]
rustflags = [
    "-C", "target-feature=-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2",
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=--no-dynamic-linker",
    "--cfg", "polyval_force_soft",
    "--cfg", "aes_force_soft",
    "--cfg", "chacha20_backend=\"soft\"",
    "--cfg", "poly1305_backend=\"soft\"",
]

[alias]
nk = "build --release -p neural-kernel --target x86_64-unknown-none"
