[workspace]
resolver = "2"
members = [
    "crates/ticket-lock",
    "crates/neural-kernel",
    "crates/agent-core",
    "crates/skill-registry",
    "crates/event-bus",
    "crates/boot",
    "crates/k_nano",
    "crates/k_ia",
    "crates/cortex",
    "crates/hermes",
    "crates/jarvis",
]
default-members = ["crates/boot"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
